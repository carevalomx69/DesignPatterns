<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Sin el patrón, el cliente depende de cada clase concreta</title>
<desc>El cliente usa if/else con new directo para crear DocumentoPDF y DocumentoWord. Agregar DocumentoXML obliga a modificar el cliente.</desc>
<defs>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="mc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0.5" y="0.5" width="679" height="269" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<line x1="300" y1="86" x2="160" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#mg)"/>
<line x1="340" y1="86" x2="340" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#mg)"/>
<line x1="380" y1="86" x2="520" y2="148" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mc)"/>
<rect x="230" y="30" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="340" y="53" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Cliente</text>
<text x="340" y="72" text-anchor="middle" font-size="12" fill="#993C1D">if / else con new directo</text>
<rect x="60" y="150" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="135" y="173" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">DocumentoPDF</text>
<text x="135" y="192" text-anchor="middle" font-size="12" fill="#5F5E5A">abrir(), guardar()</text>
<rect x="265" y="150" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="173" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">DocumentoWord</text>
<text x="340" y="192" text-anchor="middle" font-size="12" fill="#5F5E5A">abrir(), guardar()</text>
<rect x="470" y="150" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 4"/>
<text x="545" y="173" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">DocumentoXML</text>
<text x="545" y="192" text-anchor="middle" font-size="12" fill="#5F5E5A">clase nueva</text>
<line x1="60" y1="240" x2="100" y2="240" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mc)"/>
<text x="112" y="244" font-size="12" fill="#444441">Dependencia nueva que obliga a editar el cliente</text>
</svg>
