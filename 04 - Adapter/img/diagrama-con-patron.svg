<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Con Adapter, el cliente usa la interfaz propia y el adaptador traduce hacia el proveedor</title>
<desc>El cliente solo conoce la interfaz ProcesadorPago. El AdaptadorPagoTercero implementa esa interfaz y por dentro llama al ServicioTerceroPago del proveedor, traduciendo nombres y tipos.</desc>
<defs>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0.5" y="0.5" width="679" height="479" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<line x1="340" y1="86" x2="340" y2="138" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#mg)"/>
<line x1="340" y1="250" x2="340" y2="198" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mg)"/>
<line x1="340" y1="306" x2="340" y2="358" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#mg)"/>
<rect x="240" y="30" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="53" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Cliente</text>
<text x="340" y="72" text-anchor="middle" font-size="12" fill="#5F5E5A">Principal</text>
<rect x="120" y="140" width="440" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="163" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">ProcesadorPago (interfaz)</text>
<text x="340" y="182" text-anchor="middle" font-size="12" fill="#534AB7">procesarPago(BigDecimal)  obtenerEstado()</text>
<rect x="120" y="252" width="440" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="275" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">AdaptadorPagoTercero</text>
<text x="340" y="294" text-anchor="middle" font-size="12" fill="#0F6E56">traduce nombres y tipos</text>
<rect x="120" y="360" width="440" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="383" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">ServicioTerceroPago</text>
<text x="340" y="402" text-anchor="middle" font-size="12" fill="#5F5E5A">del proveedor, no se modifica</text>
<text x="340" y="421" text-anchor="middle" font-size="12" fill="#444441">realizarTransaccion(double)  consultarDisponibilidad()</text>
<line x1="60" y1="456" x2="100" y2="456" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#mg)"/>
<text x="112" y="460" font-size="12" fill="#444441">Usa</text>
<line x1="200" y1="456" x2="240" y2="456" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mg)"/>
<text x="252" y="460" font-size="12" fill="#444441">Implementa</text>
</svg>
