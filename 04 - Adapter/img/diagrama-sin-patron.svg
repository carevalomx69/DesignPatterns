<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Sin el patrón, cada cliente habla directamente el idioma del proveedor</title>
<desc>Las funciones que cobran llaman directamente al servicio del proveedor. Cada una convierte el monto de BigDecimal a double y usa los nombres del proveedor. Cambiar de proveedor obliga a reescribir cada una de ellas.</desc>
<defs>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0.5" y="0.5" width="679" height="329" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<line x1="340" y1="86" x2="340" y2="128" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#mg)"/>
<rect x="80" y="30" width="520" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="340" y="53" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Cliente</text>
<text x="340" y="72" text-anchor="middle" font-size="12" fill="#993C1D">cobrarPedido() y cobrarSuscripcion() convierten BigDecimal a double</text>
<rect x="120" y="130" width="440" height="100" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="155" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">ServicioTerceroPago</text>
<text x="340" y="174" text-anchor="middle" font-size="12" fill="#5F5E5A">del proveedor, no se puede modificar</text>
<text x="340" y="199" text-anchor="middle" font-size="12" fill="#444441">realizarTransaccion(double monto)</text>
<text x="340" y="218" text-anchor="middle" font-size="12" fill="#444441">consultarDisponibilidad()</text>
<rect x="120" y="248" width="440" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 4"/>
<text x="340" y="270" text-anchor="middle" font-size="12" fill="#444441">Otro proveedor: reescribir cada cliente</text>
</svg>
