<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Sin Observer, el sujeto conoce y llama directamente a cada interesado</title>
<desc>La clase Inscripciones revisa el cupo, y si hay lugar, crea y llama directamente a GeneradorConstancias y EnvioCorreo, cada uno con su propio nombre de método. Agregar o quitar un interesado obliga a modificar Inscripciones.</desc>
<defs>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0.5" y="0.5" width="679" height="339" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="170" y="30" width="340" height="82" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="340" y="55" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Inscripciones (sujeto)</text>
<text x="340" y="75" text-anchor="middle" font-size="12" fill="#993C1D">revisa el cupo antes de aceptar</text>
<text x="340" y="92" text-anchor="middle" font-size="12" fill="#993C1D">y llama a cada interesado por su nombre</text>
<line x1="290" y1="112" x2="220" y2="168" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#mg)"/>
<line x1="390" y1="112" x2="460" y2="168" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#mg)"/>
<rect x="110" y="170" width="220" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="220" y="196" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">GeneradorConstancias</text>
<text x="220" y="216" text-anchor="middle" font-size="12" fill="#5F5E5A">generar(alumno)</text>
<rect x="350" y="170" width="220" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="460" y="196" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">EnvioCorreo</text>
<text x="460" y="216" text-anchor="middle" font-size="12" fill="#5F5E5A">enviarBienvenida(alumno)</text>
<text x="340" y="272" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">El sujeto está acoplado a todos sus interesados.</text>
<text x="340" y="294" text-anchor="middle" font-size="12" fill="#5F5E5A">Agregar o quitar uno obliga a modificar Inscripciones.</text>
<line x1="60" y1="320" x2="100" y2="320" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#mg)"/>
<text x="112" y="324" font-size="12" fill="#444441">Usa</text>
</svg>
