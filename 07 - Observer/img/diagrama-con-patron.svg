<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Con Observer, el sujeto avisa a una lista de observadores a través de una interfaz</title>
<desc>Inscripciones revisa el cupo y, si hay lugar, guarda una lista de Observador y les avisa con actualizar(). Tres clases implementan Observador: GeneradorConstancias, EnvioCorreo y Auditoria. Se pueden suscribir y desuscribir en ejecución.</desc>
<defs>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0.5" y="0.5" width="679" height="469" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="170" y="30" width="340" height="92" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="55" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Inscripciones (sujeto)</text>
<text x="340" y="75" text-anchor="middle" font-size="12" fill="#0F6E56">regla del cupo: rechaza si no hay lugar</text>
<text x="340" y="92" text-anchor="middle" font-size="12" fill="#0F6E56">guarda una lista de observadores</text>
<text x="340" y="108" text-anchor="middle" font-size="12" fill="#0F6E56">suscribir()  desuscribir()  notificar()</text>
<line x1="340" y1="122" x2="340" y2="160" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#mg)"/>
<text x="352" y="146" font-size="12" fill="#444441">avisa con actualizar()</text>
<rect x="120" y="162" width="440" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="185" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Observador (interfaz)</text>
<text x="340" y="204" text-anchor="middle" font-size="12" fill="#534AB7">actualizar(String alumno)</text>
<line x1="125" y1="282" x2="125" y2="250" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="340" y1="282" x2="340" y2="250" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="555" y1="282" x2="555" y2="250" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="125" y1="250" x2="555" y2="250" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="340" y1="250" x2="340" y2="220" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mg)"/>
<rect x="40" y="282" width="170" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="125" y="306" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">GeneradorConstancias</text>
<text x="125" y="326" text-anchor="middle" font-size="12" fill="#5F5E5A">observador 1</text>
<rect x="255" y="282" width="170" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="306" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">EnvioCorreo</text>
<text x="340" y="326" text-anchor="middle" font-size="12" fill="#5F5E5A">observador 2</text>
<rect x="470" y="282" width="170" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="555" y="306" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Auditoria</text>
<text x="555" y="326" text-anchor="middle" font-size="12" fill="#5F5E5A">observador 3</text>
<text x="340" y="388" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">El sujeto solo conoce la interfaz.</text>
<text x="340" y="410" text-anchor="middle" font-size="12" fill="#5F5E5A">Agregar o quitar un observador no modifica a Inscripciones.</text>
<line x1="60" y1="445" x2="100" y2="445" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#mg)"/>
<text x="112" y="449" font-size="12" fill="#444441">Usa</text>
<line x1="200" y1="445" x2="240" y2="445" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mg)"/>
<text x="252" y="449" font-size="12" fill="#444441">Implementa</text>
</svg>
