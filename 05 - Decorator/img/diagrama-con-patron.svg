<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Con Decorator, cada extra envuelve a la bebida anterior</title>
<desc>El cliente usa la interfaz Bebida. El objeto que recibe es una Crema que envuelve a una Leche, que a su vez envuelve a un CafeSimple. Todos cumplen la interfaz Bebida.</desc>
<defs>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0.5" y="0.5" width="679" height="469" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<line x1="340" y1="86" x2="340" y2="128" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#mg)"/>
<rect x="240" y="30" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="53" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Cliente</text>
<text x="340" y="72" text-anchor="middle" font-size="12" fill="#5F5E5A">Principal, solo conoce Bebida</text>
<rect x="120" y="130" width="440" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="153" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Bebida (interfaz)</text>
<text x="340" y="172" text-anchor="middle" font-size="12" fill="#534AB7">obtenerDescripcion()  obtenerCosto()</text>
<line x1="340" y1="224" x2="340" y2="188" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mg)"/>
<rect x="60" y="226" width="560" height="190" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="80" y="249" font-size="13" font-weight="500" fill="#085041">Crema</text>
<text x="600" y="249" text-anchor="end" font-size="12" fill="#0F6E56">suma 10</text>
<rect x="100" y="262" width="480" height="132" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="120" y="285" font-size="13" font-weight="500" fill="#3C3489">Leche</text>
<text x="560" y="285" text-anchor="end" font-size="12" fill="#534AB7">suma 8</text>
<rect x="140" y="298" width="400" height="76" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="328" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">CafeSimple</text>
<text x="340" y="350" text-anchor="middle" font-size="12" fill="#5F5E5A">el objeto base, cuesta 30</text>
<text x="340" y="436" text-anchor="middle" font-size="12" fill="#444441">Todas las capas cumplen Bebida. Cada una le pregunta a la de adentro y agrega lo suyo.</text>
<line x1="60" y1="456" x2="100" y2="456" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mg)"/>
<text x="112" y="460" font-size="12" fill="#444441">Implementa</text>
</svg>
