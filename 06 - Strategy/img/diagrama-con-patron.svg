<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Con Strategy, el contexto delega el algoritmo a una estrategia intercambiable</title>
<desc>Catalogo guarda una EstrategiaOrden y le pregunta si un producto va antes que otro. Tres clases implementan la estrategia: por nombre, por precio y por precio descendente. Se pueden intercambiar en ejecución.</desc>
